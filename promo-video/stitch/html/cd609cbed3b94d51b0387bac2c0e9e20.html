<!DOCTYPE html><html class="dark" lang="zh-TW" style=""><head>

<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cosmic: {
              950: '#070a12',
              900: '#0b0f19',
              850: '#0e1322',
              800: '#141a2c',
            },
            astral: {
              gold: '#e6c888',
              goldLight: '#fbf0d0',

              violet: '#a78bfa',
              cyan: '#38bdf8'
            }

<!-- Astrolabe Keyframes and Celestial Motion -->
<style data-purpose="celestial-animations">
    @keyframes orbit-cw {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes orbit-ccw {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    @keyframes float-badge {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-5px) scale(1.02); }
    }
    @keyframes gold-shimmer {
      0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 10px rgba(230,200,136,0.3)); }
      50% { opacity: 1; filter: drop-shadow(0 0 20px rgba(230,200,136,0.7)); }
    }
    @keyframes pulse-halo {
      0%, 100% { transform: scale(0.96); opacity: 0.35; }
      50% { transform: scale(1.04); opacity: 0.65; }
    }
    .anim-orbit-slow { animation: orbit-cw 72s linear infinite; }
    .anim-orbit-reverse { animation: orbit-ccw 54s linear infinite; }
    .anim-orbit-fast { animation: orbit-cw 28s linear infinite; }
    .anim-float { animation: float-badge 5s ease-in-out infinite; }
    .anim-pulse-halo { animation: pulse-halo 6s ease-in-out infinite; }
    .anim-shimmer { animation: gold-shimmer 3s ease-in-out infinite; }
  </style>
<!-- Typography & Aesthetic Glass Details -->
<style data-purpose="cosmic-surfaces">
    .gold-gradient-text {
      background: linear-gradient(135deg, #fff7db 0%, #e6c888 45%, #b98e3b 85%, #f4e1a4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .astral-card {
      background: linear-gradient(180deg, rgba(25, 32, 54, 0.65) 0%, rgba(13, 17, 30, 0.75) 100%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(230, 200, 136, 0.2);
    }
  </style>
