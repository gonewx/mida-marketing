  function updateGetCodeBtnState() {
    if (countdown > 0) return;
    const val = (emailInput.value || '').trim();
    if (val.length > 0) {
      btnGetCode.classList.remove('opacity-50', 'cursor-not-allowed');
      btnGetCode.disabled = false;
    } else {
      btnGetCode.classList.add('opacity-50', 'cursor-not-allowed');
      btnGetCode.disabled = true;
    }
  }

  emailInput.addEventListener('input', () => {
    updateGetCodeBtnState();
    updatePrimaryButtonState();
  });

  codeInput.addEventListener('input', updatePrimaryButtonState);
  if (passInput) passInput.addEventListener('input', updatePrimaryButtonState);

  // Tab Switcher
  tabCode.addEventListener('click', () => {
    if (currentMode === 'code') return;
    currentMode = 'code';
    tabCode.className = 'py-2 rounded-md font-label-lg text-label-lg transition-all text-[#0B0F19] bg-[#F2CA50] shadow-sm flex items-center justify-center gap-1.5';
    tabPass.className = 'py-2 rounded-md font-label-lg text-label-lg transition-all text-[#D0C5AF] bg-transparent hover:text-on-surface flex items-center justify-center gap-1.5';
    sectionCode.classList.remove('hidden');
    sectionCode.classList.add('flex');
    sectionPass.classList.add('hidden');
    sectionPass.classList.remove('flex');
    submitBtnText.innerText = '啟程命盤 · 登入／註冊';
    updatePrimaryButtonState();
  });

  tabPass.addEventListener('click', () => {
    if (currentMode === 'pass') return;
    currentMode = 'pass';
    tabPass.className = 'py-2 rounded-md font-label-lg text-label-lg transition-all text-[#0B0F19] bg-[#F2CA50] shadow-sm flex items-center justify-center gap-1.5';
    tabCode.className = 'py-2 rounded-md font-label-lg text-label-lg transition-all text-[#D0C5AF] bg-transparent hover:text-on-surface flex items-center justify-center gap-1.5';
    sectionPass.classList.remove('hidden');
    sectionPass.classList.add('flex');
    sectionCode.classList.add('hidden');
    sectionCode.classList.remove('flex');
    submitBtnText.innerText = '啟程命盤 · 登入';
    updatePrimaryButtonState();
  });

  // Mask email helper: first 2 chars, ****, @domain
  function maskEmail(email) {
    const parts = email.split('@');
    if (parts.length !== 2) return email;
    const name = parts[0];
    const domain = parts[1];
    const prefix = name.slice(0, 2);
    return `${prefix}****@${domain}`;
  }

  // Get verification code logic
  btnGetCode.addEventListener('click', (e) => {
    if (!checkbox.checked) {
      showError();
      return;
    }
    const val = (emailInput.value || '').trim();
    if (!val || !val.includes('@')) {
      emailInput.focus();
      return;
    }

    clearError();
    codeSent = true;
    codeInput.disabled = false;
    codeInput.focus();

    // Show mint sent confirmation
    const masked = maskEmail(val);
    codeSentMsg.innerText = `已發送驗證碼至 ${masked}`;
    codeSentFeedback.classList.remove('hidden');

    countdown = 60;
    btnGetCode.disabled = true;
    btnGetCode.classList.add('opacity-50', 'cursor-not-allowed');
    btnGetCode.innerText = `${countdown}s 重發`;

    timer = setInterval(() => {
      countdown--;
      if (countdown <= 0) {
        clearInterval(timer);
        btnGetCode.disabled = false;
        btnGetCode.classList.remove('opacity-50', 'cursor-not-allowed');
        btnGetCode.innerText = '重新發送';
      } else {
        btnGetCode.innerText = `${countdown}s 重發`;
      }
    }, 1000);

    updatePrimaryButtonState();
  });

  // Primary button style toggle
  function updatePrimaryButtonState() {
    let enabled = false;
    const emailVal = (emailInput.value || '').trim();

    if (currentMode === 'code') {
      const codeVal = (codeInput.value || '').trim();
      if (codeSent && codeVal.length >= 6) {
        enabled = true;
      }
    } else {
      const passVal = (passInput.value || '').trim();
      if (emailVal.includes('@') && passVal.length >= 8) {
        enabled = true;
      }
    }

    if (enabled) {
      submitBtn.disabled = false;
      submitBtn.className = 'w-full h-12 mt-2 rounded-lg font-label-lg text-label-lg transition-all flex items-center justify-center gap-2 bg-gradient-to-r from-[#F2CA50] to-[#D4AF37] text-[#0B0F19] shadow-[0_0_20px_rgba(242,202,80,0.35)] active:scale-[0.98] cursor-pointer';
    } else {
      submitBtn.disabled = true;
      submitBtn.className = 'w-full h-12 mt-2 rounded-lg font-label-lg text-label-lg transition-all flex items-center justify-center gap-2 bg-[rgba(242,202,80,0.16)] border border-[rgba(212,175,55,0.35)] text-[rgba(242,202,80,0.55)] cursor-not-allowed';
    }
  }

  // Social & submit button terms validation
  socialBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      if (!checkbox.checked) {
        showError();
      }
    });
  });

  submitBtn.addEventListener('click', () => {
    if (!checkbox.checked) {
      showError();
    }
  });

  // Toggle Password peek
  togglePwdBtn.addEventListener('click', () => {
    const isPass = passInput.type === 'password';
    passInput.type = isPass ? 'text' : 'password';
    const icon = togglePwdBtn.querySelector('span');
    if (icon) icon.innerText = isPass ? 'visibility_off' : 'visibility';
  });

  // Invite code toggle
  inviteToggleBtn.addEventListener('click', () => {
    inviteToggleBtn.classList.add('hidden');
    inviteInputWrap.classList.remove('hidden');
    inviteInputWrap.classList.add('flex');
    inviteInput.focus();
  });
})();
</script>
</div></main></body></html>
